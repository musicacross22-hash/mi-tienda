<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pokémon TCG 30 Aniversario - Tienda Oficial</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

  /* Reset y base */
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(145deg, #f7ebe1 0%, #c1dbea 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #4a4a4a;
  }

  /* Header */
  header {
    background: #3b4cca;
    width: 100%;
    padding: 35px 20px 40px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Logo */
  header .logo {
    width: 160px;
    margin-bottom: 15px;
  }
  header .logo img {
    width: 100%;
    height: auto;
  }

  header h1 {
    font-weight: 700;
    font-size: 2.8rem;
    color: #fddd5e;
    text-shadow: 2px 2px 6px #182d7d;
    margin-bottom: 12px;
    letter-spacing: 2px;
    font-family: 'Poppins', sans-serif;
  }

  header p {
    font-weight: 600;
    font-size: 1.2rem;
    color: #e3c068;
    font-style: italic;
    text-shadow: 1px 1px 3px #1a3091;
  }

  main {
    width: 100%;
    max-width: 960px;
    background: white;
    margin: 50px 20px 80px;
    border-radius: 25px;
    box-shadow: 0 25px 50px rgba(56, 94, 249, 0.15);
    padding: 40px 30px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Título "¿Qué hay de nuevo?" con tipografía elegante */
  .novedades-titulo {
    font-family: 'Poppins', sans-serif;
    font-weight: 900;
    font-size: 3.2rem;
    color: #3b4cca;
    text-shadow:
      2px 2px 0 #fddd5e,
      4px 4px 8px rgba(0,0,0,0.2);
    margin-bottom: 40px;
    font-style: italic;
    letter-spacing: 3px;
  }

  /* Productos lado a lado */
  .productos-container {
    width: 100%;
    display: flex;
    gap: 40px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .producto {
    width: 320px;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(56, 94, 249, 0.3);
    padding: 25px 20px 35px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fefefe;
    transition: transform 0.4s ease;
  }

  .producto:hover {
    transform: scale(1.07);
  }

  .producto img {
    width: 100%;
    border-radius: 25px;
    box-shadow: 0 8px 20px rgba(56, 94, 249, 0.25);
  }

  .producto-nombre {
    margin-top: 25px;
    font-weight: 800;
    font-size: 2.1rem;
    color: #3b4cca;
    text-align: center;
    letter-spacing: 1px;
    text-shadow: 1px 1px 3px #b3bfff;
  }

  .precio {
    margin-top: 20px;
    font-weight: 700;
    font-size: 1.6rem;
    color: #f4a261;
    text-shadow: 1px 1px 2px #ab6d2f;
  }

  /* Contenedor botones func */
  .botones-funcion {
    margin-top: 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
    width: 100%;
    max-width: 600px;
  }

  /* Botones actions */
  button.func-btn {
    background: linear-gradient(135deg, #83a3f9 0%, #4068f8 100%);
    color: white;
    padding: 16px 45px;
    font-size: 1.2rem;
    font-weight: 700;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 28px #4068f8aa;
    transition: all 0.3s ease;
    user-select: none;
    min-width: 180px;
  }
  button.func-btn:hover {
    background: linear-gradient(145deg, #4068f8 0%, #2a49bb 100%);
    box-shadow: 0 15px 45px #2a49bbbb;
    transform: translateY(-6px);
  }

  /* Footer */
  footer {
    width: 100%;
    height: 80px;
    background: #fddd5e;
    border-top: 6px solid #3b4cca;
  }

  /* Responsive */
  @media (max-width: 700px) {
    .productos-container {
      flex-direction: column;
      align-items: center;
    }
    .producto {
      width: 90%;
      margin-bottom: 40px;
      padding-bottom: 30px;
    }
    .botones-funcion {
      max-width: 90vw;
      gap: 20px;
    }
    button.func-btn {
      min-width: auto;
      flex-grow: 1;
      padding: 14px 25px;
      font-size: 1.1rem;
    }
  }
</style>
</head>
<body>

<header>
  <div class="logo" aria-label="Logo oficial de Pokémon">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/Pok%C3%A9mon_logo.svg" alt="Logo Pokémon" />
  </div>
  <h1>Pokémon TCG 30 Aniversario</h1>
  <p>¡Compra tu caja edición especial ahora!</p>
</header>

<main role="main">
  <div class="novedades-titulo">¿QUÉ HAY DE NUEVO?</div>

  <div class="productos-container">
    <article class="producto">
      <img src="https://images.pokemontcg.io/swsh11/85.png" alt="Caja Pokémon 30 Aniversario - Producto 1" />
      <div class="producto-nombre">Caja Pokémon 30 Aniversario</div>
      <div class="precio">$250.000 CLP</div>
    </article>
    <article class="producto">
      <img src="https://images.pokemontcg.io/swsh11/85.png" alt="Caja Pokémon 30 Aniversario - Producto 2" />
      <div class="producto-nombre">Caja Pokémon 30 Aniversario</div>
      <div class="precio">$250.000 CLP</div>
    </article>
  </div>

  <div class="botones-funcion">
    <button class="func-btn" onclick="abrirWhatsApp()">Contacto WhatsApp</button>
    <button class="func-btn" onclick="mostrarDescuentos()">Descuentos</button>
    <button class="func-btn" onclick="abrirMetodosPago()">Métodos de Pago</button>
  </div>
</main>

<footer></footer>

<script>
  // Botón WhatsApp: cambia el número por el tuyo:
  function abrirWhatsApp() {
    const numero = '56912345678'; // Poner tu número con código país y sin signos
    const url = `https://wa.me/${numero}`;
    window.open(url, '_blank');
  }

  // Botón descuentos: muestra alerta, puedes ampliar si quieres con modales o secciones
  function mostrarDescuentos() {
    alert('¡Aprovecha nuestros descuentos exclusivos! Contáctanos por WhatsApp para más información.');
  }

  // Botón métodos de pago: abre URL donde puedan pagar (cámbiala)
  function abrirMetodosPago() {
    const url = 'https://www.tusitiodepagos.cl'; // Cambia esta URL a tu sitio o plataforma de pagos
    window.open(url, '_blank');
  }
</script>

</body>
</html>
