<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pokémon TCG 30 Aniversario - Tienda Oficial</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

  /* Reset y base */
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(145deg, #f7ebe1 0%, #c1dbea 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #4a4a4a;
  }

  /* Header */
  header {
    background: #3b4cca;
    width: 100%;
    padding: 35px 20px 40px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Logo Pokémon */
  header .logo {
    width: 160px;
    margin-bottom: 15px;
  }
  /* Usé logo oficial Pokémon SVG libre en web */
  header .logo img {
    width: 100%;
    height: auto;
  }

  header h1 {
    font-weight: 700;
    font-size: 2.8rem;
    color: #fddd5e;
    text-shadow: 2px 2px 6px #182d7d;
    margin-bottom: 12px;
    letter-spacing: 2px;
    font-family: 'Poppins', sans-serif;
  }

  header p {
    font-weight: 600;
    font-size: 1.2rem;
    color: #e3c068;
    font-style: italic;
    text-shadow: 1px 1px 3px #1a3091;
  }

  /* Contenido principal */
  main {
    width: 100%;
    max-width: 960px;
    background: white;
    margin: 50px 20px 80px;
    border-radius: 25px;
    box-shadow: 0 25px 50px rgba(56, 94, 249, 0.15);
    padding: 40px 30px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Imagen producto */
  .producto-imagen {
    width: 90%;
    max-width: 350px;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(56, 94, 249, 0.3);
    transition: transform 0.4s ease;
  }

  .producto-imagen:hover {
    transform: scale(1.07);
  }

  /* Nombre producto */
  .producto-nombre {
    margin-top: 40px;
    font-weight: 800;
    font-size: 2.4rem;
    color: #3b4cca;
    text-align: center;
    text-shadow: 1px 1px 3px #b3bfff;
    letter-spacing: 1.5px;
  }

  /* Precio */
  .precio {
    margin-top: 20px;
    font-weight: 700;
    font-size: 1.8rem;
    color: #f4a261;
    text-shadow: 1px 1px 2px #ab6d2f;
  }

  /* Botón compra */
  .boton-compra {
    margin-top: 45px;
    background: linear-gradient(145deg, #83a3f9 0%, #4068f8 100%);
    color: white;
    padding: 20px 55px;
    font-size: 1.4rem;
    font-weight: 900;
    border: none;
    border-radius: 60px;
    cursor: pointer;
    box-shadow: 0 10px 30px #4068f8aa;
    transition: all 0.3s ease;
    user-select: none;
    letter-spacing: 1px;
  }
  .boton-compra:hover {
    background: linear-gradient(145deg, #4068f8 0%, #2a49bb 100%);
    box-shadow: 0 15px 45px #2a49bbbb;
    transform: translateY(-5px);
  }

  /* Footer */
  footer {
    width: 100%;
    height: 80px;
    background: #fddd5e;
    border-top: 6px solid #3b4cca;
  }

  /* Responsive */
  @media (max-width: 540px) {
    header h1 {
      font-size: 2rem;
    }
    main {
      margin: 30px 15px 60px;
      padding: 30px 20px 50px;
    }
    .producto-nombre {
      font-size: 1.8rem;
    }
    .precio {
      font-size: 1.5rem;
    }
    .boton-compra {
      font-size: 1.2rem;
      padding: 16px 45px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="logo" aria-label="Logo oficial de Pokémon">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/Pok%C3%A9mon_logo.svg" alt="Logo Pokémon" />
  </div>
  <h1>Pokémon TCG 30 Aniversario</h1>
  <p>¡Compra tu caja edición especial ahora!</p>
</header>

<main role="main">
  <img class="producto-imagen" src="https://images.pokemontcg.io/swsh11/85.png" alt="Caja Pokémon 30 Aniversario - Urshifu V Single Strike" />
  <div class="producto-nombre">Caja Pokémon 30 Aniversario</div>
  <div class="precio">$250.000 CLP</div>
  <button class="boton-compra" aria-label="Comprar Caja Pokémon 30 Aniversario">Comprar ahora</button>
</main>

<footer></footer>

</body>
</html>
