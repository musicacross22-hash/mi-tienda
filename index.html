<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda Pokémon 30 Aniversario</title>
  <style>
    /* Fuentes y reset básico */
    @import url('https://fonts.googleapis.com/css2?family=Pokémon&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #f7d02c 0%, #3b4cca 90%);
      color: #2a2a2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
      text-shadow: 0 0 10px #000;
    }

    header h1 {
      font-size: 3.5rem;
      font-weight: 900;
      font-family: 'Arial Black', Gadget, sans-serif;
      margin-bottom: 10px;
      letter-spacing: 3px;
    }

    header p {
      font-size: 1.3rem;
      font-weight: 600;
      font-style: italic;
    }

    main {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 40px;
      max-width: 1200px;
      width: 100%;
    }

    .producto {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
      max-width: 320px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .producto:hover {
      transform: translateY(-10px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.35);
    }

    .producto img {
      width: 100%;
      height: auto;
      display: block;
      background: linear-gradient(45deg, #f7d02c, #3b4cca);
      padding: 15px;
    }

    .producto-info {
      padding: 20px;
      text-align: center;
    }

    .producto-info h2 {
      color: #ff1c1c;
      font-size: 1.8rem;
      margin-bottom: 10px;
      font-weight: 700;
      text-shadow: 1px 1px 3px #3b4cca;
    }

    .producto-info p {
      font-size: 1rem;
      color: #555;
      margin-bottom: 20px;
      font-style: italic;
      height: 60px;
    }

    .precio {
      font-size: 1.8rem;
      color: #2a75bb;
      font-weight: 800;
      margin-bottom: 25px;
      text-shadow: 1px 1px 2px #f7d02c;
    }

    button {
      display: inline-block;
      background: #ffcb05;
      color: #2a75bb;
      border: 3px solid #2a75bb;
      border-radius: 40px;
      padding: 12px 40px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px #b58e09 inset;
      user-select: none;
    }

    button:hover {
      background: #f0b700;
      border-color: #1d516b;
      box-shadow: 0 6px #945d00 inset;
      transform: scale(1.05);
    }

    #carrito {
      margin-top: 50px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      color: #2a75bb;
      font-weight: 700;
    }

    #carrito h2 {
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px #ffcb05;
    }

    #lista-carrito {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
      padding-left: 0;
      margin-bottom: 20px;
      border-top: 2px solid #2a75bb;
      border-bottom: 2px solid #2a75bb;
    }

    #lista-carrito li {
      padding: 10px 15px;
      border-bottom: 1px solid #c5c5c5;
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      color: #444;
    }

    #total {
      font-size: 1.8rem;
      text-align: right;
      color: #ff1c1c;
      text-shadow: 1px 1px 3px #000;
    }

    /* Scrollbar para carrito */
    #lista-carrito::-webkit-scrollbar {
      width: 8px;
    }
    #lista-carrito::-webkit-scrollbar-thumb {
      background-color: #ffcb05;
      border-radius: 10px;
    }
    #lista-carrito::-webkit-scrollbar-track {
      background: #eee;
    }

    /* Responsive */
    @media (max-width: 700px) {
      main {
        flex-direction: column;
        align-items: center;
      }
      .producto {
        max-width: 90%;
      }
      #carrito {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Tienda Oficial Pokémon 30 Aniversario</h1>
    <p>Venta exclusiva: Cajas Pokémon TCG edición especial</p>
  </header>

  <main>
    <article class="producto">
      <img src="https://images.pokemontcg.io/swsh5/150_hires.png" alt="Caja Pokémon 30 Aniversario" />
      <div class="producto-info">
        <h2>Caja Pokémon 30 Aniversario</h2>
        <p>Edición oficial con contenido exclusivo para coleccionistas.</p>
        <div class="precio">$250.000 CLP</div>
        <button onclick="agregarAlCarrito('Caja Pokémon 30 Aniversario', 250000)">Agregar al carrito</button>
      </div>
    </article>
  </main>

  <section id="carrito">
    <h2>Carrito de Compras</h2>
    <ul id="lista-carrito"></ul>
    <p>Total: $<span id="total">0</span> CLP</p>
  </section>

  <script>
    const carrito = [];

    function agregarAlCarrito(nombre, precio) {
      carrito.push({nombre, precio});
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const lista = document.getElementById('lista-carrito');
      const totalElemento = document.getElementById('total');
      lista.innerHTML = '';
      let total = 0;

      carrito.forEach((item, i) => {
        const li = document.createElement('li');
        li.textContent = item.nombre + ' - $' + item.precio.toLocaleString();
        lista.appendChild(li);
        total += item.precio;
      });

      totalElemento.textContent = total.toLocaleString();
    }
  </script>
  
</body>
</html>
