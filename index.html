<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pokémon TCG 30 Aniversario - Tienda Oficial</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap');

  /* Reseteo básico */
  * {
    margin:0; padding:0; box-sizing: border-box;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#f5e1a4 0%,#ffcb05 100%);
    min-height:100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #333;
  }

  header {
    padding: 40px 20px;
    text-align: center;
    background: #3b4cca;
    width: 100%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    color: white;
  }

  header h1 {
    font-weight: 800;
    font-size: 3rem;
    letter-spacing: 4px;
    text-shadow: 0 3px 5px rgba(0,0,0,0.3);
    margin-bottom: 10px;
  }

  header p {
    font-weight: 300;
    font-size: 1.3rem;
    font-style: italic;
    color: #ffde59;
    text-shadow: 0 2px 3px rgba(0,0,0,0.15);
  }

  main {
    padding: 50px 20px;
    display: flex;
    gap: 50px;
    max-width: 1200px;
    width: 100%;
    flex-wrap: wrap;
    justify-content: center;
  }

  .producto {
    background: white;
    border-radius: 20px;
    max-width: 350px;
    box-shadow: 0 20px 35px rgba(0,0,0,0.2);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
  }

  .producto:hover {
    transform: translateY(-20px);
    box-shadow: 0 35px 50px rgba(0,0,0,0.3);
  }

  .producto img {
    width: 100%;
    object-fit: cover;
    border-bottom: 3px solid #ffcb05;
  }

  .producto-info {
    padding: 25px 20px 35px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .producto-info h2 {
    color: #3b4cca;
    font-weight: 800;
    font-size: 1.8rem;
    margin-bottom: 15px;
    text-align: center;
  }

  .producto-info p {
    flex-grow: 1;
    color: #555;
    font-size: 1rem;
    margin-bottom: 25px;
    text-align: justify;
    line-height: 1.4;
  }

  .precio {
    font-weight: 900;
    font-size: 1.9rem;
    color: #ff3e3e;
    text-align: center;
    margin-bottom: 20px;
    text-shadow: 1px 1px 2px #00000033;
  }

  button {
    background: linear-gradient(135deg,#ffcb05,#ffde59);
    border: none;
    padding: 15px 35px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 1.2rem;
    color: #3b4cca;
    box-shadow: 0 8px 20px #ffcb05aa;
    cursor: pointer;
    transition: all 0.25s ease;
    align-self: center;
    width: 100%;
    max-width: 250px;
    user-select: none;
  }

  button:hover {
    background: linear-gradient(135deg,#ffde59,#ffcb05);
    box-shadow: 0 12px 30px #ffcb05cc;
    transform: scale(1.05);
  }

  section#carrito {
    max-width: 700px;
    background: white;
    margin-top: 60px;
    border-radius: 30px;
    padding: 30px 40px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.1);
    color: #3b4cca;
  }

  #carrito h2 {
    text-align: center;
    font-weight: 900;
    margin-bottom: 25px;
    text-shadow: 0 1px 3px #ffde59aa;
    font-size: 2rem;
  }

  #lista-carrito {
    list-style: none;
    max-height: 220px;
    overflow-y: auto;
    padding-left: 0;
    margin-bottom: 25px;
    border-top: 3px solid #ffcb05;
    border-bottom: 3px solid #ffcb05;
  }

  #lista-carrito li {
    padding: 15px 20px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 1.1rem;
    color: #222;
  }

  #total {
    font-size: 1.8rem;
    font-weight: 900;
    text-align: right;
    color: #ff3e3e;
    text-shadow: 1px 1px 3px #00000022;
  }

  #lista-carrito::-webkit-scrollbar {
    width: 8px;
  }

  #lista-carrito::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 20px;
  }

  #lista-carrito::-webkit-scrollbar-thumb {
    border-radius: 20px;
    background: #ffcb05;
  }

  /* Responsive */
  @media (max-width: 800px) {
    main {
      flex-direction: column;
      align-items: center;
    }
    .producto {
      max-width: 90vw;
      margin-bottom: 40px;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Pokémon TCG 30 Aniversario</h1>
  <p>¡Compra tu caja edición especial ahora!</p>
</header>

<main>
  <article class="producto" tabindex="0" aria-label="Caja Pokémon 30 Aniversario">
    <img src="https://images.pokemontcg.io/swsh5/150_hires.png" alt="Caja Pokémon 30 Aniversario" />
    <div class="producto-info">
      <h2>Caja Pokémon 30 Aniversario</h2>
      <p>Edición oficial con cartas y contenido exclusivo de colección para fanáticos de Pokémon. Perfecta para regalar o comenzar una colección.</p>
      <div class="precio">$250.000 CLP</div>
      <button aria-label="Agregar Caja Pokémon 30 Aniversario al carrito" onclick="agregarAlCarrito('Caja Pokémon 30 Aniversario', 250000)">Agregar al carrito</button>
    </div>
  </article>
  <!-- Puedes agregar más productos aquí repitiendo la estructura del artículo-->
</main>

<section id="carrito" aria-live="polite" aria-relevant="additions removals">
  <h2>Carrito de compras</h2>
  <ul id="lista-carrito" role="list"></ul>
  <p id="total">Total: $0 CLP</p>
</section>

<script>
  const carrito = [];

  function agregarAlCarrito(nombre, precio) {
    carrito.push({nombre, precio});
    actualizarCarrito();
  }

  function actualizarCarrito() {
    const lista = document.getElementById('lista-carrito');
    const totalElemento = document.getElementById('total');
    lista.innerHTML = '';

    let total = 0;
    carrito.forEach(item => {
      const li = document.createElement('li');
      li.textContent = `${item.nombre} - $${item.precio.toLocaleString()}`;
      lista.appendChild(li);
      total += item.precio;
    });

    totalElemento.textContent = `Total: $${total.toLocaleString()} CLP`;
  }
</script>

</body>
</html>
