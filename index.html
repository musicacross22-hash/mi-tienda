<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pokémon TCG 30 Aniversario - Tienda Oficial</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Pacifico&display=swap');

  /* Reset */
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(130deg, #fefefe, #cde7f9);
    color: #333;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    background: #3b4cca;
    color: #fff7a1;
    padding: 50px 20px 60px;
    box-shadow: 0 8px 15px rgba(59, 76, 202, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header .logo {
    width: 180px;
    margin-bottom: 20px;
  }

  header .logo img {
    width: 100%;
  }

  header h1 {
    font-family: 'Pacifico', cursive;
    font-size: 3.8rem;
    letter-spacing: 3px;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    margin-bottom: 10px;
  }

  header p {
    font-weight: 700;
    font-size: 1.5rem;
    color: #fff3b0;
    font-style: italic;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
  }

  main {
    max-width: 960px;
    background: #fff;
    border-radius: 25px;
    padding: 50px 40px 60px;
    margin: -40px 20px 60px; /* overlapping header */
    box-shadow: 0 25px 60px rgba(59, 76, 202, 0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .section-title {
    font-weight: 800;
    font-size: 3.5rem;
    color: #3b4cca;
    letter-spacing: 2px;
    margin-bottom: 50px;
    font-family: 'Pacifico', cursive;
    text-shadow:
      2px 2px 0 #ffde59,
      5px 5px 10px rgba(0,0,0,0.1);
  }

  .products-container {
    display: flex;
    gap: 50px;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
  }

  .product-card {
    background: #f9faff;
    border-radius: 30px;
    box-shadow: 0 12px 35px rgba(59, 76, 202, 0.25);
    width: 320px;
    padding: 30px 25px 40px;
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: default;
  }

  .product-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 22px 45px rgba(59, 76, 202, 0.4);
  }

  .product-image {
    width: 100%;
    border-radius: 22px;
    box-shadow: 0 6px 20px rgba(59, 76, 202, 0.25);
    transition: transform 0.35s ease;
  }

  .product-card:hover .product-image {
    transform: scale(1.05);
  }

  .product-title {
    font-weight: 700;
    font-size: 1.7rem;
    color: #2f3dab;
    margin: 25px 0 12px;
    letter-spacing: 0.5px;
  }

  .product-price {
    font-size: 1.6rem;
    color: #ff7f20;
    font-weight: 800;
    margin-bottom: 28px;
    text-shadow: 1px 1px 3px #bb6b1a;
  }

  .button {
    background: linear-gradient(135deg, #ffcb05 0%, #ff9c26 100%);
    border: none;
    color: #3b4cca;
    font-weight: 800;
    font-size: 1.2rem;
    padding: 15px 40px;
    border-radius: 50px;
    box-shadow: 0 8px 25px #ff9c26aa;
    cursor: pointer;
    transition: all 0.3s ease;
    user-select: none;
  }

  .button:hover {
    background: linear-gradient(145deg, #ff9c26 0%, #ffcb05 100%);
    box-shadow: 0 12px 40px #fda617cc;
    transform: scale(1.05);
  }

  .actions {
    width: 100%;
    max-width: 600px;
    margin-top: 45px;
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
  }

  .actions button {
    flex: 1 1 180px;
  }

  /* Responsive */

  @media (max-width: 730px) {
    main {
      margin: -30px 15px 40px;
      padding: 35px 25px 50px;
    }

    .products-container {
      flex-direction: column;
      align-items: center;
    }

    .product-card {
      width: 90%;
      max-width: 400px;
      margin-bottom: 35px;
    }

    .actions {
      max-width: 90vw;
      gap: 20px;
    }
  }

</style>
</head>
<body>

<header>
  <div class="logo" aria-label="Logo oficial Pokémon">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/Pok%C3%A9mon_logo.svg" alt="Logo Pokémon" />
  </div>
  <h1>Pokémon TCG 30 Aniversario</h1>
  <p>¡Compra tu caja edición especial ahora!</p>
</header>

<main>
  <div class="section-title" aria-label="Título sección novedades">¿Qué hay de nuevo?</div>
  <div class="products-container">
    <article class="product-card" tabindex="0">
      <img class="product-image" src="https://images.pokemontcg.io/swsh11/85.png" alt="Caja Pokémon 30 Aniversario Urshifu V Single Strike" />
      <h2 class="product-title">Caja Pokémon 30 Aniversario</h2>
      <div class="product-price">$250.000 CLP</div>
    </article>

    <article class="product-card" tabindex="0">
      <img class="product-image" src="https://images.pokemontcg.io/swsh11/85.png" alt="Caja Pokémon 30 Aniversario Urshifu V Single Strike" />
      <h2 class="product-title">Caja Pokémon 30 Aniversario</h2>
      <div class="product-price">$250.000 CLP</div>
    </article>
  </div>

  <div class="actions" role="region" aria-label="Botones de contacto y pagos">
    <button class="button" onclick="abrirWhatsApp()">
      Contacto WhatsApp
    </button>
    <button class="button" onclick="mostrarDescuentos()">
      Descuentos
    </button>
    <button class="button" onclick="abrirMetodosPago()">
      Métodos de Pago
    </button>
  </div>
</main>

<footer aria-hidden="true" style="width:100%; height:80px; background:#ffcb05; border-top:5px solid #3b4cca; box-shadow: 0 -4px 10px #3b4cca55;"></footer>

<script>
  function abrirWhatsApp() {
    const numero = '56912345678'; // Cambia por tu número con código país sin signos
    const url = `https://wa.me/${numero}`;
    window.open(url, '_blank');
  }

  function mostrarDescuentos() {
    alert('¡Aprovecha nuestros descuentos exclusivos! Contáctanos por WhatsApp para más información.');
  }

  function abrirMetodosPago() {
    const url = 'https://www.tusitiodepagos.cl'; // Cambia por tu sitio de pagos
    window.open(url, '_blank');
  }
</script>

</body>
</html>
